<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>One Tab Only — Already Open</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="intervention-page">
  <div class="intervention-container">
    <div class="intervention-badge">Duplicate Tab Detected</div>

    <h1 class="intervention-title">Hold on a sec.</h1>

    <p class="intervention-sub">
      You already have <strong id="domain-name">this site</strong> open in another tab.
    </p>

    <div class="intervention-actions">
      <button id="switch-btn" class="btn-primary">Switch to existing tab</button>
      <button id="replace-btn" class="btn-secondary">Close old &amp; continue</button>
      <button id="ignore-btn" class="btn-secondary">Open anyway</button>
    </div>

    <p class="intervention-hint">
      Press <kbd>Enter</kbd> to switch
    </p>
  </div>

  <script src="intervention.js"></script>
</body>
</html>
